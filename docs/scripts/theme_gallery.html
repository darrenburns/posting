<title>Posting Dark Theme Shortlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Schibsted+Grotesk:wght@400..700&display=swap">
<style>
/* Layout: a quiet neutral contact sheet of real Posting screens; the themes supply all the colour.
   Single dark look by design, since every candidate is a dark theme. */
:root {
  --ground: #111113;
  --raised: #19191c;
  --line: #2a2a2f;
  --ink: #ececef;
  --ink-2: #9d9da6;
  --ink-3: #66666f;
  --font-ui: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-grid: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --grid-adv: 0.6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 15px/1.5 var(--font-ui);
  padding-inline: clamp(16px, 3vw, 40px);
  padding-block: 32px 120px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
kbd {
  font: 600 11px/1 var(--font-grid);
  padding: 3px 5px;
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--ink-2);
}

/*SCREENS_CSS*/
.tui { background: var(--t-bg); }
.tui-grid { padding-block: 0; }
/*SLOT_CSS*/
/*THEME_CSS*/

header {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  justify-content: space-between;
  gap: 20px 32px;
  max-width: 1480px;
  margin-inline: auto;
  margin-block-end: 28px;
}
header .intro { min-width: 0; max-width: 60ch; }
h1 {
  margin: 0 0 6px;
  font-size: clamp(26px, 3.4vw, 36px);
  line-height: 1.1;
  font-weight: 650;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
h1 span { font-family: var(--font-grid); font-weight: 400; font-size: 0.6em; color: var(--ink-3); letter-spacing: 0; vertical-align: 0.35em; margin-inline-start: 6px; }
.intro p { margin: 0; color: var(--ink-2); }
.controls { display: flex; flex-wrap: wrap; gap: 12px; }
.seg {
  display: flex;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--raised);
}
.seg button {
  display: flex;
  align-items: center;
  gap: 7px;
  border: 0;
  background: none;
  color: var(--ink-2);
  padding: 6px 11px;
  border-radius: 6px;
  font-size: 14px;
  white-space: nowrap;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-checked="true"] { background: var(--ink); color: var(--ground); }
.seg button[aria-checked="true"] kbd { color: var(--ground); border-color: color-mix(in srgb, var(--ground) 35%, transparent); }
.seg .n { font-family: var(--font-grid); font-size: 12px; opacity: 0.7; font-variant-numeric: tabular-nums; }

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr));
  gap: 28px 24px;
  max-width: 1480px;
  margin-inline: auto;
}
.card { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.card[hidden] { display: none; }
.shot {
  display: block;
  width: 100%;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  background: var(--t-bg);
  cursor: zoom-in;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.shot:hover { border-color: var(--ink-3); }
.card.kept .shot { border-color: var(--t-primary); box-shadow: 0 0 0 1px var(--t-primary); }
.meta { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.meta-text { min-width: 0; }
.meta h2 { margin: 0; font: 600 16px/1.3 var(--font-grid); }
.meta p { margin: 2px 0 8px; color: var(--ink-2); font-size: 14px; }
.swatches { display: flex; gap: 4px; }
.swatches i { width: 18px; height: 10px; border-radius: 2px; box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.1); }

.keep {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px 7px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--raised);
  font-weight: 550;
  font-size: 14px;
}
.keep:hover { border-color: var(--ink-3); }
.keep .box {
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 1.5px solid var(--ink-3);
  display: grid; place-items: center;
}
.keep[aria-pressed="true"] { background: var(--t-primary); border-color: var(--t-primary); color: var(--t-on-primary); }
.keep[aria-pressed="true"] .box { border-color: currentColor; background: currentColor; }
.keep[aria-pressed="true"] .box::after {
  content: ""; width: 4px; height: 8px; margin-top: -2px;
  border: solid var(--t-primary); border-width: 0 2px 2px 0; transform: rotate(45deg);
}
.keep .lbl::before { content: "Keep"; }
.keep[aria-pressed="true"] .lbl::before { content: "Kept"; }

.card.ref h2::after { content: "built-in"; margin-inline-start: 8px; font: 500 11px var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.empty { grid-column: 1 / -1; color: var(--ink-2); padding: 40px 0; text-align: center; }

/* Selection bar */
.tray {
  position: fixed;
  inset-inline: 0;
  bottom: 0;
  z-index: 10;
  padding: 12px clamp(16px, 3vw, 40px) calc(12px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
.tray-inner { max-width: 1480px; margin-inline: auto; display: flex; align-items: center; gap: 16px; }
.count { flex: none; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.count b { color: var(--ink); font-weight: 650; }
.chips { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chips button {
  flex: none;
  border: 0;
  padding: 3px 9px;
  border-radius: 5px;
  background: var(--t-primary);
  color: var(--t-on-primary);
  font: 600 12px/1.5 var(--font-grid);
}
.chips .hint { color: var(--ink-3); font-size: 14px; white-space: nowrap; }
.tray .actions { flex: none; display: flex; gap: 8px; }
.btn {
  border: 1px solid var(--line);
  background: var(--raised);
  padding: 8px 14px;
  border-radius: 8px;
  font-weight: 550;
  font-size: 14px;
}
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.copied {
  position: fixed; left: 50%; bottom: 84px; z-index: 30; transform: translateX(-50%);
  background: var(--ink); color: var(--ground); padding: 8px 14px; border-radius: 8px; font-weight: 550;
}
.fallback {
  position: fixed; inset-inline: clamp(16px, 3vw, 40px); bottom: 84px; z-index: 30;
  max-width: 520px; margin-inline: auto; padding: 14px; border-radius: 10px;
  background: var(--raised); border: 1px solid var(--line);
}
.fallback p { margin: 0 0 8px; color: var(--ink-2); font-size: 14px; }
.fallback textarea {
  width: 100%; min-height: 120px; resize: vertical; background: var(--ground); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: 13px/1.5 var(--font-grid);
}

/* Lightbox */
.lightbox {
  position: fixed; inset: 0; z-index: 20;
  background: rgb(6 6 8 / 0.9);
  backdrop-filter: blur(6px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px;
  padding: calc(16px + env(safe-area-inset-top, 0px)) clamp(16px, 3vw, 40px) calc(16px + env(safe-area-inset-bottom, 0px));
}
.lightbox .frame { width: min(100%, 1400px, calc((100vh - 170px) * 130 * 0.6 / (36 * 1.25))); }
.lightbox .shot { cursor: default; border-color: var(--ink-3); }
.lb-bar { width: min(100%, 1400px); display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.lb-bar .meta-text { flex: 1; min-width: 200px; }
.lb-bar h2 { margin: 0; font: 600 18px/1.3 var(--font-grid); }
.lb-bar p { margin: 0; color: var(--ink-2); font-size: 14px; }
.lb-nav { display: flex; gap: 8px; align-items: center; }
.lb-nav .pos { font: 13px var(--font-grid); color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 5ch; text-align: center; }
.lb-help { color: var(--ink-3); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.lb-help span { display: flex; gap: 5px; align-items: center; }

@media (max-width: 640px) {
  .tray-inner { flex-wrap: wrap; }
  .chips { order: 3; flex-basis: 100%; }
  .tray .actions { margin-inline-start: auto; }
  .lb-help { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header>
  <div class="intro">
    <h1>Dark theme shortlist <span>__COUNT__ candidates</span></h1>
    <p>Each screen is Posting 3 rendering itself in that theme. Mark the ones worth keeping, then copy their names from the bar at the bottom. Click a screen to enlarge it.</p>
  </div>
  <div class="controls">
    <div class="seg" role="radiogroup" aria-label="Screen">
      <!--SCENE_BUTTONS-->
    </div>
    <div class="seg" role="radiogroup" aria-label="Show">
      <button type="button" role="radio" data-filter="all" aria-checked="true">All <span class="n" data-n="all"></span></button>
      <button type="button" role="radio" data-filter="kept" aria-checked="false">Kept <span class="n" data-n="kept"></span></button>
      <button type="button" role="radio" data-filter="open" aria-checked="false">Undecided <span class="n" data-n="open"></span></button>
    </div>
  </div>
</header>

<main class="gallery" id="gallery">
<!--CARDS-->
<p class="empty" id="empty" hidden></p>
</main>

<div class="tray">
  <div class="tray-inner">
    <div class="count"><b id="kept-n">0</b> of __COUNT__ kept</div>
    <div class="chips" id="chips"></div>
    <div class="actions">
      <button type="button" class="btn" id="clear" disabled>Clear</button>
      <button type="button" class="btn primary" id="copy" disabled>Copy names</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-labelledby="lb-name">
  <div class="frame"><div class="shot"><div class="tui"></div></div></div>
  <div class="lb-bar">
    <div class="meta-text"><h2 id="lb-name"></h2><p id="lb-blurb"></p></div>
    <div class="lb-help">
      <span><kbd>←</kbd><kbd>→</kbd> browse</span>
      <span><kbd>K</kbd> keep</span>
      <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> screen</span>
      <span><kbd>Esc</kbd> close</span>
    </div>
    <div class="lb-nav">
      <button type="button" class="btn" id="lb-prev" aria-label="Previous theme">←</button>
      <span class="pos" id="lb-pos"></span>
      <button type="button" class="btn" id="lb-next" aria-label="Next theme">→</button>
      <button type="button" class="keep" id="lb-keep" aria-pressed="false"><span class="box" aria-hidden="true"></span><span class="lbl"></span></button>
      <button type="button" class="btn" id="lb-close">Close</button>
    </div>
  </div>
</div>

<!--TEMPLATES-->

<script>
(() => {
  const STORE = "posting-dark-shortlist";
  const cards = [...document.querySelectorAll(".card")];
  const names = cards.filter(c => !c.classList.contains("ref")).map(c => c.dataset.name);
  const $ = id => document.getElementById(id);
  let scene = "response";
  let filter = "all";
  let kept = new Set();
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || "{}");
    (saved.kept || []).filter(n => names.includes(n)).forEach(n => kept.add(n));
    if (document.getElementById("scene-" + saved.scene)) scene = saved.scene;
  } catch {}
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify({ kept: [...kept], scene })); } catch {} };

  const fill = el => {
    el.replaceChildren(document.getElementById("scene-" + scene).content.cloneNode(true));
  };
  const renderScene = () => {
    cards.forEach(c => fill(c.querySelector(".tui")));
    document.querySelectorAll("[data-scene]").forEach(b => b.setAttribute("aria-checked", b.dataset.scene === scene));
    if (!$("lightbox").hidden) fill($("lightbox").querySelector(".tui"));
  };

  const render = () => {
    let shown = 0;
    cards.forEach(c => {
      const on = kept.has(c.dataset.name);
      c.classList.toggle("kept", on);
      c.querySelector(".keep")?.setAttribute("aria-pressed", on);
      c.hidden = (filter === "kept" && !on) || (filter === "open" && on);
      if (!c.hidden) shown++;
    });
    const empty = $("empty");
    empty.hidden = shown > 0;
    empty.textContent = filter === "kept" ? "Nothing kept yet. Press Keep on any theme you like." : "Every theme has been kept.";
    const list = names.filter(n => kept.has(n));
    $("kept-n").textContent = list.length;
    document.querySelector('[data-n="all"]').textContent = names.length;
    document.querySelector('[data-n="kept"]').textContent = list.length;
    document.querySelector('[data-n="open"]').textContent = names.length - list.length;
    const chips = $("chips");
    chips.replaceChildren(...(list.length ? list.map(n => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "th-" + n;
      b.textContent = n;
      b.title = "Show " + n;
      b.addEventListener("click", () => openLightbox(cards.findIndex(c => c.dataset.name === n)));
      return b;
    }) : [Object.assign(document.createElement("span"), { className: "hint", textContent: "Kept themes appear here." })]));
    $("copy").disabled = $("clear").disabled = list.length === 0;
    if (!$("lightbox").hidden) syncLightbox();
    save();
  };

  const toggle = name => { if (!names.includes(name)) return; kept.has(name) ? kept.delete(name) : kept.add(name); render(); };

  cards.forEach((c, i) => {
    c.querySelector(".keep")?.addEventListener("click", () => toggle(c.dataset.name));
    c.querySelector(".shot").addEventListener("click", () => openLightbox(i));
  });
  document.querySelectorAll("[data-scene]").forEach(b => b.addEventListener("click", () => { scene = b.dataset.scene; renderScene(); save(); }));
  document.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => {
    filter = b.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(x => x.setAttribute("aria-checked", x === b));
    render();
  }));

  // Lightbox
  let current = 0;
  let lastFocus = null;
  const lb = $("lightbox");
  const syncLightbox = () => {
    const card = cards[current];
    const name = card.dataset.name;
    lb.className = "lightbox th-" + name;
    $("lb-name").textContent = name;
    $("lb-blurb").textContent = card.querySelector(".meta p").textContent;
    $("lb-pos").textContent = `${current + 1}/${cards.length}`;
    $("lb-keep").setAttribute("aria-pressed", kept.has(name));
    $("lb-keep").hidden = !names.includes(name);
  };
  function openLightbox(i) {
    current = i;
    if (lb.hidden) lastFocus = document.activeElement;
    lb.hidden = false;
    fill(lb.querySelector(".tui"));
    syncLightbox();
    $("lb-close").focus();
  }
  const closeLightbox = () => { lb.hidden = true; lastFocus?.focus(); };
  const step = d => {
    const visible = cards.map((c, i) => i).filter(i => !cards[i].hidden);
    const pool = visible.length ? visible : cards.map((c, i) => i);
    const at = pool.indexOf(current);
    current = pool[(at + d + pool.length) % pool.length];
    syncLightbox();
  };
  $("lb-prev").addEventListener("click", () => step(-1));
  $("lb-next").addEventListener("click", () => step(1));
  $("lb-close").addEventListener("click", closeLightbox);
  $("lb-keep").addEventListener("click", () => toggle(cards[current].dataset.name));
  lb.addEventListener("click", e => { if (e.target === lb) closeLightbox(); });

  const sceneKeys = [...document.querySelectorAll("[data-scene]")].map(b => b.dataset.scene);
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === "TEXTAREA") return;
    if (/^[1-9]$/.test(e.key) && sceneKeys[e.key - 1]) { scene = sceneKeys[e.key - 1]; renderScene(); save(); return; }
    if (lb.hidden) return;
    if (e.key === "Escape") closeLightbox();
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "k" || e.key === "K") toggle(cards[current].dataset.name);
    else return;
    e.preventDefault();
  });

  // Copy / clear
  let toastTimer;
  const toast = text => {
    document.querySelector(".copied")?.remove();
    const t = Object.assign(document.createElement("div"), { className: "copied", textContent: text });
    t.setAttribute("role", "status");
    document.body.append(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.remove(), 1800);
  };
  $("copy").addEventListener("click", () => {
    const list = names.filter(n => kept.has(n));
    const text = list.join("\n");
    const fallback = () => {
      document.querySelector(".fallback")?.remove();
      const box = document.createElement("div");
      box.className = "fallback";
      box.innerHTML = '<p>Copying was blocked here. The names are selected below; copy them with your keyboard.</p><textarea id="fallback-text" readonly></textarea><button type="button" class="btn">Done</button>';
      box.querySelector("textarea").value = text;
      box.querySelector("button").addEventListener("click", () => box.remove());
      document.body.append(box);
      box.querySelector("textarea").select();
    };
    if (!navigator.clipboard) return fallback();
    navigator.clipboard.writeText(text).then(
      () => toast(`Copied ${list.length} name${list.length === 1 ? "" : "s"}`),
      fallback
    );
  });
  let armed = false;
  $("clear").addEventListener("click", e => {
    if (!armed) {
      armed = true;
      e.currentTarget.textContent = "Clear all?";
      setTimeout(() => { armed = false; $("clear").textContent = "Clear"; }, 2500);
      return;
    }
    armed = false;
    $("clear").textContent = "Clear";
    kept.clear();
    render();
  });

  renderScene();
  render();
})();
</script>
