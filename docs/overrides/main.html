{% extends "base.html" %}

{% block fonts %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Martian+Mono:wdth,wght@75..112.5,400..700&family=Schibsted+Grotesk:wght@400..700&display=swap">
{% endblock %}

{% block extrahead %}
<script>
  // Restore the visitor's theme before first paint.
  try {
    var saved = localStorage.getItem("posting.palette");
    if (saved && /^[a-z-]+$/.test(saved)) document.documentElement.setAttribute("data-palette", saved);
  } catch (e) {}
</script>
{% endblock %}
