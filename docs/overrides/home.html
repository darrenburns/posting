{% extends "main.html" %}

{% block extrahead %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&family=Martian+Mono:wdth,wght@75..112.5,400..700&family=Schibsted+Grotesk:wght@400..700&display=swap">
<link rel="stylesheet" href="{{ 'stylesheets/home-palettes.css' | url }}">
<link rel="stylesheet" href="{{ 'stylesheets/home.css' | url }}">
<script>
  // Restore the visitor's theme before first paint.
  try {
    var saved = localStorage.getItem("posting.home.palette");
    if (saved && /^[a-z-]+$/.test(saved)) document.documentElement.setAttribute("data-palette", saved);
  } catch (e) {}
</script>
{% endblock %}

{% block tabs %}
{{ super() }}
{% include "partials/home-body.html" %}
{% endblock %}

{% block content %}{% endblock %}

{% block footer %}{% endblock %}
