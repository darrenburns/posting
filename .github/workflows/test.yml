name: Continuous Integration

on:
    pull_request:
    push:
      branches:
        - "main"

env:
    PYTEST_ADDOPTS: "--color=yes"

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --snapshot --clean

  python:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Install a specific version of uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.3"
          enable-cache: true
      - run: uv python install  # Will read from .python-version
      - name: Install Dependencies
        run: uv sync --all-extras --dev
      - name: Run Tests
        run: |
            uv run make test-ci
      - name: Attach Code Coverage
        uses: py-cov-action/python-coverage-comment-action@v3.25
        with:
            GITHUB_TOKEN: ${{ github.token }}

      - name: Save Snapshot Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-report-posting
          path: snapshot_report.html
    
      - name: Store Pull Request Comment
        uses: actions/upload-artifact@v4
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
            # If you use a different name, update COMMENT_ARTIFACT_NAME accordingly
            name: python-coverage-comment-action
            # If you use a different name, update COMMENT_FILENAME accordingly
            path: python-coverage-comment-action.txt
