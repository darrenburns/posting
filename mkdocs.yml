site_name: Posting
site_url: https://posting.sh
repo_url: https://github.com/darrenburns/posting
repo_name: darrenburns/posting
theme:
  name: material
  palette:
    scheme: slate
    primary: custom
  custom_dir: docs/overrides
  icon:
    logo: fontawesome/solid/paper-plane
  # Fonts are loaded by docs/overrides/main.html.
  font: false
  features:
    - search.suggest
    - search.highlight
    - header.autohide
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.footer
    - toc.integrate
extra_css:
  - stylesheets/palettes.css
  - stylesheets/theme.css
  - stylesheets/terminal.css
  - stylesheets/home-palettes.css
  - stylesheets/screens.css
extra_javascript:
  - javascripts/palette.js
  - javascripts/commands.js
exclude_docs: |
  overrides/
  scripts/
nav:
  - Home: "index.md"
  - Guide:
    - "Getting Started": "guide/index.md"
    - "Coming from Posting 2": "guide/migrating.md"
    - "Navigation": "guide/navigation.md"
    - "Collections": "guide/collections.md"
    - "Requests": "guide/requests.md"
    - "Responses": "guide/responses.md"
    - "Environments": "guide/environments.md"
    - "Command Palette": "guide/command_palette.md"
    - "Themes": "guide/themes.md"
    - "External Tools": "guide/external_tools.md"
    - "Keymaps": "guide/keymap.md"
    - "Importing": "guide/importing.md"
    - "Remote Control": "guide/remote_control.md"
    - "Configuration": "guide/configuration.md"
    - "Scripting": "guide/scripting.md"
    - "Help": "guide/help_system.md"
  - Roadmap: "roadmap.md"
  - Changelog: "CHANGELOG.md"
  - FAQ: "faq.md"
plugins:
  - search
  - tags
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - toc:
      permalink: true
  - footnotes
  - tables
  - pymdownx.keys
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.details
  # Embeds the screens captured from Posting 3 (make docs-screens).
  - pymdownx.snippets:
      base_path: docs/overrides/partials/screens
      check_paths: true
extra:
  social:
    - icon: fontawesome/brands/mastodon 
      link: https://fosstodon.org/@darrenburns
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/_darrenburns
    - icon: fontawesome/brands/github
      link: https://github.com/darrenburns
copyright: Copyright &copy; 2024 Darren Burns